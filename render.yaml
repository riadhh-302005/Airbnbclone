services:
  - type: web
    name: airbnb-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && PYTHONPATH=. python -m app.seed
    startCommand: PYTHONPATH=. uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000
